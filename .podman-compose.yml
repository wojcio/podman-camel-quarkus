version: '3.8'

services:
  camel-quarkus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: podman-camel-quarkus
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - CAMEL_INPUT_DIR=/home/quarkus/deploy/input
      - CAMEL_OUTPUT_DIR=/home/quarkus/deploy/output
      - CAMEL_ARCHIVE_DIR=/home/quarkus/deploy/archive
    volumes:
      # Persistent storage - deploy folder linking to current directory
      - ./deploy:/home/quarkus/deploy:Z
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - camel-network

networks:
  camel-network:
    name: camel-network