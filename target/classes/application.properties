# Camel Quarkus Configuration
quarkus.application.name=podman-camel-quarkus

# Camel configuration
camel.context.name=podman-camel-context

# Logging configuration
quarkus.log.level=INFO
quarkus.log.category."org.example.camel".level=DEBUG

# HTTP Server Configuration
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}

# Native image configuration (for Podman build)
quarkus.native.additional-build-args=\
    --enable-http-handler,\
    --enable-https-handler

# Metrics
quarkus.micrometer.enabled=true