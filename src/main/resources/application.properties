# Camel Quarkus Configuration
quarkus.application.name=podman-camel-quarkus

# Camel configuration
camel.context.name=podman-camel-context

# Logging configuration
quarkus.log.level=INFO
quarkus.log.category."org.example.camel".level=DEBUG

# HTTP Server Configuration (for HealthResource REST endpoints)
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}

# Netty HTTP configuration (for Bookshop REST API on port 8081)
quarkus.netty.ports=8081

# Database configuration for Bookshop API
# SQLite JDBC connection string - database file will be created in deploy directory
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:deploy/bookshop.db

# Native image configuration (for Podman build)
quarkus.native.additional-build-args=\
    --enable-http-handler,\
    --enable-https-handler,\
    -H:+AddAllCharsets

# Metrics
quarkus.micrometer.enabled=true